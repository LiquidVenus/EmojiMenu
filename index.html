<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat Emoji & GIF Menu</title>
  <link href="app://assets/styles/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script>window.jQuery = window.$ = require('jquery');</script>
  <script src="app://assets/scripts/jquery-ui.js"></script>
  <style>
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(156, 163, 175, 0.15);
    }

    .tab-btn {
      flex: 1;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(156, 163, 175, 0.15);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 12px;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: var(--theme-primary, #e83d52);
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 6px;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      height: auto;
      max-height: 70vh;
      overflow-y: auto;
    }
    
    .emoji-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(156, 163, 175, 0.15);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
    }

    .emoji-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--theme-primary, #e83d52);
      transform: scale(1.1);
    }

    .gif-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(156, 163, 175, 0.15);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
      overflow: hidden;
      position: relative;
    }

    .gif-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gif-btn:hover {
      border-color: var(--theme-primary, #e83d52);
      transform: scale(1.05);
    }

    .search-input {
      width: 100%;
      padding: 4px 8px;
      margin-bottom: 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(156, 163, 175, 0.15);
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
      line-height: 1.2;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--theme-primary, #e83d52);
      background: rgba(255, 255, 255, 0.08);
    }
    
    .jam-plugin-content {
      display: flex;
      flex-direction: column;
      padding: 4px;
      gap: 4px;
      flex: 1;
    }

    .tab-content {
      display: none;
      flex-direction: column;
      flex: 1;
      gap: 4px;
    }

    .tab-content.active {
      display: flex;
    }
  </style>
</head>
<body class="bg-primary-bg text-text-primary p-0 h-screen flex flex-col overflow-hidden">
  <div class="jam-plugin-header">
    <span class="jam-plugin-title">Emoji & GIF Menu</span>
    <div class="jam-plugin-controls">
      <button class="jam-plugin-minimize" aria-label="Minimize">
        <i class="fas fa-minus"></i>
      </button>
      <button class="jam-plugin-close" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <div class="jam-plugin-content">
    <div class="tabs">
      <button class="tab-btn active" data-tab="emojis">Emojis</button>
      <button class="tab-btn" data-tab="gifs">GIFs</button>
    </div>

    <input type="text" class="search-input" id="searchInput" placeholder="Search...">

    <div class="tab-content active" id="emojis-tab">
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="tab-content" id="gifs-tab">
      <div class="emoji-grid" id="gifGrid"></div>
    </div>
  </div>

  <script src="app://assets/scripts/plugin-utils.js"></script>
  <script src="index.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initializePluginUI();
    });
  </script>
</body>
</html>
